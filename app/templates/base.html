<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job VC{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css?v=5c">
  {% block head %}{% endblock %}
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Job VC</h1>
      <nav class="nav">
        <a href="/">Vacancies</a>
        <a href="/technologies">Technologies</a>
        <a href="/companies">Companies</a>
        <a href="/analytics">Analytics</a>
        <a href="/tracking">Tracker</a>
      </nav>
      {% set current_user = current_user_fn(request) %}
      {% if current_user %}
      <div class="user-bar">
        <span class="avatar-chip">{{ current_user.name[:2] | upper }}</span>
        <span class="user-name">{{ current_user.name }}</span>
        <form action="/auth/logout" method="post" style="display:inline;margin:0">
          <button type="submit" class="signout-btn">Sign out</button>
        </form>
      </div>
      {% else %}
      <div class="user-bar">
        <a href="/auth/login" class="signin-btn">Sign in</a>
      </div>
      {% endif %}
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
