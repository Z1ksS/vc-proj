{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h2>Technologies <span class="count-label">{{ techs | length }}</span></h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Technology</th>
          <th>Vacancies</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for name, cnt in techs %}
        <tr>
          <td class="muted">{{ loop.index }}</td>
          <td><strong>{{ name }}</strong></td>
          <td>{{ cnt }}</td>
          <td><a href="/?tech={{ name | urlquote }}">Browse →</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
